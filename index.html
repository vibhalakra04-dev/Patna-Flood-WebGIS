<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AI-Enabled WebGIS Platform</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/georaster"></script>

<script src="https://unpkg.com/georaster-layer-for-leaflet/dist/georaster-layer-for-leaflet.min.js"></script>

<style>

html,body{

height:100%;
margin:0;
font-family:Arial,sans-serif;

}

header{

background:#1565C0;
color:white;
text-align:center;
padding:18px;
font-size:22px;
font-weight:bold;

}

.container{

display:flex;
height:calc(100% - 78px);

}

.sidebar{

width:320px;
background:#f4f4f4;
padding:15px;
box-sizing:border-box;
overflow:auto;

}

.sidebar h2{

margin-top:0;

}

.sidebar button{

width:100%;
padding:14px;
margin-bottom:12px;
border:none;
border-radius:6px;
background:#1565C0;
color:white;
font-size:18px;
cursor:pointer;

}

.sidebar button:hover{

background:#0d47a1;

}

#map{

flex:1;

}

</style>

</head>

<body>

<header>

AI-Enabled WebGIS Platform for Flood Susceptibility,
Exposure and Risk Assessment
Patna Metropolitan Area

</header>

<div class="container">

<div class="sidebar">

<h2>Map Layers</h2>

<button onclick="showLayer('susceptibility')">

Flood Susceptibility

</button>

<button onclick="showLayer('population_density')">

Population Density

</button>

<button onclick="showLayer('road_density')">

Road Density

</button>

<button onclick="showLayer('hospital_density')">

Hospital Density

</button>

<button onclick="showLayer('school_density')">

School Density

</button>

<button onclick="removeLayer()">

Hide Layer

</button>

</div>

<div id="map"></div>

</div>

<script>

var map=L.map('map').setView([25.60,85.15],10);

L.tileLayer(

'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

{

maxZoom:19,

attribution:'© OpenStreetMap'

}

).addTo(map);

var boundary;

fetch("data/patna_boundaet_geojson.geojson")

.then(response=>response.json())

.then(function(data){

boundary=L.geoJSON(data,{

style:{

color:"black",

weight:3,

fill:false

}

}).addTo(map);

map.fitBounds(boundary.getBounds());

});

var rasterLayer=null;

function removeLayer(){

if(rasterLayer){

map.removeLayer(rasterLayer);

}

}

function showLayer(name){

removeLayer();

fetch("data/"+name+".tif")

.then(response=>response.arrayBuffer())

.then(arrayBuffer=>parseGeoraster(arrayBuffer))

.then(function(georaster){

rasterLayer=new GeoRasterLayer({

georaster:georaster,

opacity:0.75,

resolution:256

});

rasterLayer.addTo(map);

});

}

</script>

</body>

</html>
